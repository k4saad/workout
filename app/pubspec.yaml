name: keller_twelve
description: "Single-user offline training app for the Keller Twelve programme."
publish_to: 'none'

# versionName+versionCode. Bump both on every install-over-the-top.
version: 0.1.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter

  # state
  flutter_riverpod: ^3.0.3
  riverpod_annotation: ^3.0.3

  # routing
  go_router: ^16.2.4

  # files / paths
  path_provider: ^2.1.5
  path: ^1.9.1

  # database
  drift: ^2.28.2
  sqlite3_flutter_libs: ^0.5.42

  # timers, notifications, wakelock
  flutter_local_notifications: ^19.4.2
  timezone: ^0.10.1
  flutter_timezone: ^4.1.1
  wakelock_plus: ^1.3.2
  audioplayers: ^6.5.1

  # backup / export
  archive: ^4.0.7
  share_plus: ^12.0.1
  file_picker: ^10.3.3

  # progress photos. `camera` (not image_picker) because image_picker hands
  # off to the system camera app and cannot draw the ghost overlay over the
  # viewfinder — and the overlay is the entire point of the feature.
  camera: ^0.11.2
  image: ^4.5.4
  local_auth: ^2.3.0

  # ids
  uuid: ^4.5.1

  # formatting
  intl: ^0.20.2

  # value equality for immutable models
  collection: ^1.19.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # codegen
  drift_dev: ^2.28.2
  build_runner: ^2.4.15
  riverpod_generator: ^3.0.3
  custom_lint: ^0.8.1
  riverpod_lint: ^3.0.3

  # used by the schema-validation test (gate V1)
  json_schema: ^5.2.1

  # in-memory sqlite for domain tests, no device needed
  sqlite3: ^2.9.1

flutter:
  uses-material-design: true
  assets:
    - assets/programmes/
    - assets/exercises/
