name: keller_twelve
description: "Single-user offline training app for the Keller Twelve programme."
publish_to: 'none'

# versionName+versionCode. Bump both on every install-over-the-top.
version: 0.1.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter

  # state
  flutter_riverpod: ^3.0.3
  riverpod_annotation: ^3.0.3

  # routing
  go_router: ^16.2.4

  # files / paths
  path_provider: ^2.1.5
  path: ^1.9.1

  # formatting
  intl: ^0.20.2

  # value equality for immutable models
  collection: ^1.19.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # codegen
  build_runner: ^2.4.15
  riverpod_generator: ^3.0.3
  custom_lint: ^0.8.1
  riverpod_lint: ^3.0.3

  # used by the schema-validation test (gate V1)
  json_schema: ^5.2.1

flutter:
  uses-material-design: true
  assets:
    - assets/programmes/
    - assets/exercises/
